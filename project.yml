name: HermesMobile
options:
  bundleIdPrefix: com.hermesmobile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  HermesMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HermesMobile
    info:
      path: HermesMobile/Resources/Info.plist
      properties:
        CFBundleDisplayName: HermesMobile
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: O Hermes usa o microfone no modo de voz para ouvir suas perguntas.
        NSPhotoLibraryUsageDescription: O Hermes acessa suas fotos para enviar imagens como anexo no chat.
        # Apenas NSAllowsArbitraryLoads. NÃO combine com NSAllowsLocalNetworking —
        # no iOS 10+ isso faz ArbitraryLoads ser ignorado e HTTP em *.ts.net falha (-1022).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmobile.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
