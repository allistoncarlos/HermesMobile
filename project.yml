name: HermesMobile
options:
  bundleIdPrefix: com.hermesmobile
  deploymentTarget:
    iOS: "16.5"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  HermesMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.5"
    sources:
      - HermesMobile
    info:
      path: HermesMobile/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: O Hermes usa o microfone no modo de voz para ouvir suas perguntas.
        NSPhotoLibraryUsageDescription: O Hermes acessa suas fotos para enviar imagens como anexo no chat.
        UIBackgroundModes:
          - audio
        # Apenas NSAllowsArbitraryLoads. NÃO combine com NSAllowsLocalNetworking —
        # no iOS 10+ isso faz ArbitraryLoads ser ignorado e HTTP em *.ts.net falha (-1022).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmobile.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    # Push Notifications (aps-environment) fica para Fase 2 / APNs: o perfil
    # wildcard "iOS Team Provisioning Profile: *" não inclui Push. Notificações
    # locais (UNUserNotificationCenter) não precisam dessa capability.
    dependencies:
      - target: HermesWatch
        embed: true
        codeSign: true
    scheme:
      management:
        shared: true
        orderHint: 0
        isShown: true
  HermesWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HermesWatch
      - path: HermesMobile/Voice
        excludes:
          - HermesSpeakStream.swift
          - BackgroundRuntime.swift
      - path: HermesMobile/Companion
      - path: HermesMobile/Networking/Models.swift
      - path: HermesMobile/Intents
    info:
      path: HermesWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "3"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.hermesmobile.app
        WKRunsIndependentlyOfCompanionApp: false
        NSMicrophoneUsageDescription: O Hermes usa o microfone do Apple Watch para ouvir suas perguntas.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        WKBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmobile.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.hermesmobile.app
        INFOPLIST_KEY_WKApplication: YES
        CODE_SIGN_ENTITLEMENTS: HermesWatch/HermesWatch.entitlements
    entitlements:
      path: HermesWatch/HermesWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hermesmobile.app.watchkitapp
    dependencies:
      - target: HermesWatchWidgets
        embed: true
        codeSign: true
      - sdk: WidgetKit.framework
    scheme:
      management:
        shared: true
        orderHint: 1
        isShown: true
  HermesWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: HermesWatchWidgets
      - path: HermesMobile/Companion/WatchComplicationRoster.swift
      - path: HermesMobile/Companion/HermesAccent.swift
      - path: HermesMobile/Intents
    info:
      path: HermesWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HermesWatchWidgets/HermesWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hermesmobile.app.watchkitapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmobile.app.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        CODE_SIGN_ENTITLEMENTS: HermesWatchWidgets/HermesWatchWidgets.entitlements
        INFOPLIST_FILE: HermesWatchWidgets/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG WIDGET_EXTENSION"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: UIKit.framework
    scheme:
      management:
        shared: true
        orderHint: 2
        isShown: false
